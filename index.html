<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CHI-A Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .sub-header { color: #aaaaaa; font-size: 14px; margin-bottom: 20px; }
        .input-container { display: flex; justify-content: center; max-width: 500px; margin: 0 auto 20px; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #fff; color: #000; font-size: 16px; }
        .btn-send { background-color: #1D61E7; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .button-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        button { background-color: #3a3a3a; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        button.active { background-color: #e74c3c; }
        #status { color: #888; margin-top: 20px; font-size: 16px; }
        #answer { font-size:18px; margin:20px auto; padding:15px; background:#2a2a2a; border-radius:10px; max-width:500px; text-align:left; }
        #photo { display:none; width:100%; max-width:500px; margin:15px auto; border-radius:10px; }
    </style>
</head>
<body>

    <div class="header">CHI-A</div>
    <div class="sub-header">OV5640 + Gemini + MAX98357A</div>

    <div class="input-container">
        <input type="text" id="textQuery" placeholder="can you introduce yourself in english?">
        <button class="btn-send" onclick="askText()">📩 Send</button>
    </div>

    <div class="button-group">
        <button id="cameraButton" onclick="askText()">📷 Ask Camera</button>
        <button id="voiceButton" onclick="askVoice()">🎤 Ask Voice</button>
        <button id="iphoneButton" onclick="iphoneMic()">📱 iPhone Microphone</button>
    </div>

    <div id="status">Ready.</div>
    <img id="photo">
    <div id="answer">Ready.</div>

    <script>
        var ESP_IP = "http://192.168.1.38";
        var WS_IP  = "ws://192.168.1.38/ws";

        var ws;
        var audioContext;
        var processor;
        var localStream;
        var micBtn = document.getElementById('iphoneButton');
        var statusLabel = document.getElementById('status');

        function initWebSocket() {
            ws = new WebSocket(WS_IP);
            ws.binaryType = 'arraybuffer';
            ws.onopen = function() { statusLabel.innerText = "Connected to CHI-A."; };
            ws.onclose = function() { statusLabel.innerText = "Disconnected. Reconnecting..."; setTimeout(initWebSocket, 2000); };
        }

        function showCameraImage(){
            document.getElementById("status").innerText="📷 Taking picture...";
            document.getElementById("photo").src = ESP_IP + "/capture?t=" + Date.now();
            document.getElementById("photo").style.display="block";
        }

        function askText(){
            var q = document.getElementById("textQuery").value;
            if(!q) q = "What do you see in this picture?";
            document.getElementById("answer").innerText = "";
            showCameraImage();
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", ESP_IP + "/ask?q=" + encodeURIComponent(q), true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    showResult(JSON.parse(xhr.responseText));
                } else {
                    statusLabel.innerText = "Connection error.";
                }
            };
            xhr.onerror = function() { statusLabel.innerText = "Connection error."; };
            xhr.send();
        }

        function askVoice(){
            statusLabel.innerText = "🎤 Listening (INMP441) for 4s...";
            document.getElementById("answer").innerText = "";
            showCameraImage();
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", ESP_IP + "/askvoice", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    showResult(JSON.parse(xhr.responseText));
                } else {
                    statusLabel.innerText = "Connection error.";
                }
            };
            xhr.onerror = function() { statusLabel.innerText = "Connection error."; };
            xhr.send();
        }

        function iphoneMic() {
            var getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;

            if (!getUserMedia && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                getUserMedia = function(constraints, success, failure) {
                    navigator.mediaDevices.getUserMedia(constraints).then(success).catch(failure);
                };
            }

            if (!getUserMedia) {
                alert("Microphone streaming is not supported on this device/browser.");
                return;
            }

            if (!audioContext) {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", ESP_IP + '/start_iphone_rec', true);
                xhr.send();

                showCameraImage();

                getUserMedia.call(navigator, { audio: true, video: false }, function(stream) {
                    localStream = stream;
                    var AudioCtx = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioCtx({ sampleRate: 16000 });
                    var source = audioContext.createMediaStreamSource(localStream);

                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    source.connect(processor);
                    processor.connect(audioContext.destination);

                    processor.onaudioprocess = function(e) {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            var inputData = e.inputBuffer.getChannelData(0);
                            var pcmData = new Int16Array(inputData.length);
                            for (var i = 0; i < inputData.length; i++) {
                                pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                            }
                            ws.send(pcmData.buffer);
                        }
                    };

                    micBtn.classList.add('active');
                    micBtn.innerHTML = "🔴 Stop Microphone";
                    statusLabel.innerText = "📱 Streaming iPhone mic to CHI-A...";
                }, function(err) {
                    alert("Microphone permission denied or error: " + err);
                });
            } else {
                if (processor) processor.disconnect();
                if (localStream) {
                    var tracks = localStream.getTracks();
                    for (var t = 0; t < tracks.length; t++) {
                        tracks[t].stop();
                    }
                }
                if (audioContext) audioContext.close();
                audioContext = null;

                micBtn.classList.remove('active');
                micBtn.innerHTML = "📱 iPhone Microphone";
                statusLabel.innerText = "Processing iPhone audio with Gemini...";

                var stopXhr = new XMLHttpRequest();
                stopXhr.open("GET", ESP_IP + '/stop_iphone_rec', true);
                stopXhr.onload = function() {
                    if (stopXhr.status === 200) {
                        showResult(JSON.parse(stopXhr.responseText));
                    } else {
                        statusLabel.innerText = "Processing error.";
                    }
                };
                stopXhr.onerror = function() { statusLabel.innerText = "Processing error."; };
                stopXhr.send();
            }
        }

        function showResult(d){
            document.getElementById("answer").innerText = d.answer || d.error || "No response.";
            statusLabel.innerText = d.voice ? "CHI-A Speaking..." : "Ready.";
        }

        window.onload = initWebSocket;
    </script>
</body>
</html>
